name: CI / quality-and-security-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-tests-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valor sintáctico únicamente para importar config.py durante las pruebas.
      # Las pruebas unitarias no se conectan a MongoDB.
      MONGO_CONNECTION_STRING: mongodb://localhost:27017
      DB_NAME: BeatWatchDb_Test
      ETL_BATCH_INTERVAL_SECONDS: "60"
      ETL_RUN_ON_STARTUP: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q -x '/\.venv/' .

      - name: Ruff
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Bandit SAST
        run: bandit -q -r . -x ./tests,./.venv -ll

      - name: Secret leak gate
        run: python scripts/security_scan.py

      - name: Runtime dependency audit
        run: pip-audit -r requirements.txt

      - name: Dev dependency audit
        run: pip-audit -r requirements-dev.txt

      - name: Build hardened container
        run: docker build -t beatwatch-etl:ci .

      - name: Verify container runs as non-root
        run: |
          docker run --rm --entrypoint sh beatwatch-etl:ci -c '
            test "$(id -u)" -ne 0 &&
            test ! -e /app/test_extract.py &&
            test ! -e /app/test_connection.py &&
            test ! -e /app/.env
          '
